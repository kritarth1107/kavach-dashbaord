name: Deploy dashboard to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          AUTH_URL: ${{ vars.AUTH_URL }}
        run: |
          npm ci
          npm run build

      - name: Prepare standalone package
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          zip -rq ../../deploy.zip .

      - name: Deploy to Azure Web App
        env:
          PUBLISH_USER: ${{ secrets.WEBAPP_PUBLISH_USER }}
          PUBLISH_PASS: ${{ secrets.WEBAPP_PUBLISH_PASS }}
        run: |
          curl -fsS -X POST \
            -u "$PUBLISH_USER:$PUBLISH_PASS" \
            --data-binary @deploy.zip \
            "https://kavach-care-web.scm.azurewebsites.net/api/zipdeploy?isAsync=true"
