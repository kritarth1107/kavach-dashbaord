name: Deploy dashboard to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dashboard-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR: 743887469650.dkr.ecr.ap-south-1.amazonaws.com/kavach-dashboard
  FAMILY: kavach-dashboard
  SERVICE: dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and lint
        run: |
          npx next typegen
          npx tsc --noEmit -p .
          npx eslint . --max-warnings=0
          npm run test:records
          npm run test:memory
          npm run test:nutrition

  # Every page for synthetic world families, in six parts at once (each its own production build); part 1 also runs the
  # one-off views (onboarding, person scope, conversations…).
  pages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Every page for synthetic world families (part ${{ matrix.part }} of 6)
        env:
          AUTH_SECRET: ci-page-test-only
          AUTH_URL: http://localhost:3123
          AUTH_TRUST_HOST: "true"
        run: |
          npx playwright install --with-deps chromium
          npx next build
          (TZ=UTC npx next start -p 3123 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 45); do curl -sf -o /dev/null http://localhost:3123/auth/login && break; sleep 2; done
          PAGES_BASE=http://localhost:3123 PAGES_FAMILIES=12 PAGES_PARALLEL=6 PAGES_SHARD=${{ matrix.part }}/6 node scripts/test-pages.mjs

  # The image is built and pushed while the tests run; deploy rolls it out only after every test part passed.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kavach-dashbaord
          aws-region: ap-south-1
      - name: Build and push
        env:
          IMAGE: ${{ env.ECR }}:${{ github.sha }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR%/*}"
          docker build --build-arg NEXT_PUBLIC_API_URL=https://api.brainbehindkavach.me -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: [test, pages, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kavach-dashbaord
          aws-region: ap-south-1
      - name: Roll the live service
        env:
          IMAGE: ${{ env.ECR }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition \
            | jq --arg IMG "$IMAGE" --arg NAME "kavach-dashboard" --arg API "https://api.brainbehindkavach.me" '
                .containerDefinitions |= map(if ((.image | split("/") | last | split(":")[0]) == $NAME) then
                  .image = $IMG
                  | .environment = ((.environment // []) | map(select(.name != "NEXT_PUBLIC_API_URL")) + [{name: "NEXT_PUBLIC_API_URL", value: $API}])
                else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/td.json
          REV=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json --query taskDefinition.revision --output text)
          aws ecs update-service --cluster kavach --service "$SERVICE" --task-definition "$FAMILY:$REV" >/dev/null
          aws ecs wait services-stable --cluster kavach --service "$SERVICE"
      - name: Smoke test
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://app.kavach.care/auth/login | grep -E '200|307'
